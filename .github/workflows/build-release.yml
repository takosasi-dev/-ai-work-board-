name: Build Windows exe and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -X utf8 test_ai_work_board.py
      - name: Build exe with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name AIWorkBoard ai_work_board.py
      - name: Publish to Release (tag = VERSION in ai_work_board.py)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "v" + (python -c "import ai_work_board as a; print(a.VERSION)")
          if (gh release view $v 2>$null) {
            gh release upload $v dist\AIWorkBoard.exe --clobber
          } else {
            gh release create $v dist\AIWorkBoard.exe --title $v --notes "AI Work Board $v - Windows exe"
          }
